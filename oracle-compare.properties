# Diese UTF-8-Datei wird aus dem Arbeitsverzeichnis des Java-Prozesses geladen.
# Schemanamen exakt wie im Oracle-Dictionary, ohne aeussere SQL-Anfuehrungszeichen.
reference.schema=REFERENZ
target.schema=ZIEL
output.path=sql/abgleich-ziel.sql
# Optional: Ohne Angabe entsteht output.path mit zusaetzlicher Endung .md.
report.path=reports/abgleich-ziel.md

# Optionale Ausschluesse gelten fuer beide Schemata und alle vier Objekttypen.
# Nummern muessen positiv sein. Gross-/Kleinschreibung spielt keine Rolle.
# exclude.1=AUDIT_LOG
# exclude.2=TMP_*
# exclude.3=*_BACKUP?
# Properties maskiert Backslashes: REPORT\\* bezeichnet den woertlichen Namen REPORT*.
# Fuer Windows-Pfade Vorwaertsschraegstriche oder doppelte Backslashes verwenden.
